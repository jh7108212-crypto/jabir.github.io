<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jabir Edits</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #0f172a;
  color: white;
}

header {
  background: linear-gradient(90deg, #0ea5e9, #22c55e);
  padding: 15px;
  text-align: center;
  font-size: 22px;
  font-weight: bold;
}

.container {
  padding: 20px;
  max-width: 500px;
  margin: auto;
}

.box {
  background: #1e293b;
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 20px;
}

input, textarea, button {
  padding: 12px;
  width: 100%;
  margin-top: 10px;
  border-radius: 8px;
  border: none;
}

textarea {
  height: 80px;
}

button {
  background: #22c55e;
  color: white;
  cursor: pointer;
}

h2 {
  color: #38bdf8;
}

.footer {
  text-align: center;
  padding: 10px;
  color: gray;
}
</style>
</head>

<body>

<header>
🎬 Jabir Cinematic Edits
</header>

<div class="container">

<div class="box">
<h2>💼 About Me</h2>
<p>I create cinematic Instagram & Facebook videos.</p>
</div>

<div class="box">
<h2>💰 Price Calculator</h2>

<input type="number" id="duration" placeholder="Enter duration (seconds)">

<button onclick="calculate()">Calculate Price</button>

<h3 id="price"></h3>

<button onclick="payNow()">Pay Now</button>
</div>

<div class="box">
<h2>📝 Place Order</h2>

<input type="text" id="name" placeholder="Your Name">
<input type="number" id="duration2" placeholder="Video Duration (seconds)">
<textarea id="details" placeholder="Describe your video"></textarea>

<button onclick="sendOrder()">Send Order on WhatsApp</button>
</div>

<div class="box">
<h2>🎥 My Work</h2>

<video width="100%" controls>
  <source src="video1.mp4" type="video/mp4">
</video>

</div>

<div class="box">
<h2>📞 Contact</h2>
<p>WhatsApp: 919154185613</p>

<a href="https://wa.me/919154185613?text=Hi%20I%20want%20video%20editing">
<button>Chat on WhatsApp</button>
</a>
</div>

</div>

<div class="footer">
© 2026 Jabir Edits
</div>

<script>
function calculate() {
  let seconds = document.getElementById("duration").value;
  let price = Math.round((seconds / 60) * 200);
  document.getElementById("price").innerText = "Price: ₹" + price;
}

function payNow() {
  let seconds = document.getElementById("duration").value;
  let price = Math.round((seconds / 60) * 200);

  let upi = "upi://pay?pa=7035041538-7@ybl&pn=JabirEdits&am=" + price + "&cu=INR";
  window.location.href = upi;

  setTimeout(() => {
    window.location.href = "https://wa.me/919154185613?text=I%20paid%20₹" + price;
  }, 3000);
}

function sendOrder() {
  let name = document.getElementById("name").value;
  let seconds = document.getElementById("duration2").value;
  let details = document.getElementById("details").value;

  let price = Math.round((seconds / 60) * 200);

  let msg = "New Order:%0AName: " + name + "%0ADuration: " + seconds + " sec%0APrice: ₹" + price + "%0ADetails: " + details;

  window.open("https://wa.me/919154185613?text=" + msg);
}
</script>

</body>
</html>
