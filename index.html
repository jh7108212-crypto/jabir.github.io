<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jabir Edits</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: #020617;
  color: white;
}

.hero {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 50px;
  flex-wrap: wrap;
}

.hero-text {
  max-width: 50%;
}

.hero-text h1 {
  font-size: 36px;
}

.hero-text p {
  color: #94a3b8;
}

.hero-text button {
  background: linear-gradient(45deg, #22c55e, #0ea5e9);
  padding: 14px 24px;
  border: none;
  border-radius: 8px;
  margin-top: 15px;
  color: white;
  cursor: pointer;
}

.hero-img img {
  width: 260px;
  border-radius: 20px;
  animation: float 3s ease-in-out infinite;
}

@keyframes float {
  0% { transform: translateY(0px); }
  50% { transform: translateY(-10px); }
  100% { transform: translateY(0px); }
}

.card {
  background: rgba(255,255,255,0.05);
  margin: 20px;
  padding: 25px;
  border-radius: 12px;
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-5px);
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}

video {
  width: 100%;
  border-radius: 10px;
}

input, textarea {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 6px;
  border: none;
}

.btn {
  background: #22c55e;
  padding: 12px;
  border: none;
  border-radius: 6px;
  margin-top: 10px;
  color: white;
  cursor: pointer;
}

.btn:hover {
  opacity: 0.8;
}

@media(max-width:768px){
  .hero {
    flex-direction: column;
    text-align: center;
  }
  .hero-text {
    max-width: 100%;
  }
  .grid {
    grid-template-columns: 1fr;
  }
}

footer {
  text-align: center;
  padding: 20px;
  color: gray;
}
</style>
</head>

<body>

<div class="hero">
  <div class="hero-text">
    <h1>🎬 Jabir Edits</h1>
    <p>Cinematic Video Editor</p>
    <p>💰 ₹200 per minute</p>
    <button onclick="orderNow()">🚀 Order Now</button>
  </div>

  <div class="hero-img">
    <img src="profile.jpg" alt="Jabir">
  </div>
</div>

<div class="card">
<h2>💰 Price Calculator</h2>
<p style="color:gray;">Enter duration in seconds</p>
<input type="number" id="duration" placeholder="e.g. 120">
<h3 id="price"></h3>
</div>

<div class="card">
<h2>🎥 Portfolio</h2>
<div class="grid">
<video controls src="video1.mp4"></video>
<video controls src="video2.mp4"></video>
</div>
</div>

<div class="card">
<h2>📝 Order</h2>
<input type="text" id="name" placeholder="Your Name">
<input type="number" id="duration2" placeholder="Duration in seconds">
<textarea id="details" placeholder="Explain your video"></textarea>
<button class="btn" onclick="send()">📲 Send on WhatsApp</button>
</div>

<div class="card">
<h2>📞 Contact</h2>
<p>Instagram: @shaikhjabir_02</p>
<button class="btn" onclick="orderNow()">Chat on WhatsApp</button>
</div>

<footer>
© 2026 Jabir Edits
</footer>

<script>
function calc(){
 let s=document.getElementById("duration").value;
 let p=Math.round((s/60)*200);
 document.getElementById("price").innerText="Price: ₹"+p;
}

document.getElementById("duration").addEventListener("input", calc);

function send(){
 let n=document.getElementById("name").value;
 let s=document.getElementById("duration2").value;
 let d=document.getElementById("details").value;
 let p=Math.round((s/60)*200);

 let msg = encodeURIComponent(
"New Order:\nName:"+n+"\nDuration:"+s+" sec\nPrice:₹"+p+"\nDetails:"+d
);

 window.open("https://wa.me/919154185613?text="+msg);
}

function orderNow(){
 window.open("https://wa.me/919154185613?text=Hi%20I%20want%20editing");
}
</script>

</body>
</html>
