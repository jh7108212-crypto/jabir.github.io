<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jabir Edits</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  color: white;
  background:#020617;
}

/* BACKGROUND VIDEO */
.bg-video {
  position: fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:-2;
}

/* DARK OVERLAY */
body::before {
  content:"";
  position:fixed;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
  z-index:-1;
}

/* NAV */
.navbar {
  display:flex;
  justify-content:space-between;
  padding:20px;
}

.logo {
  font-size:22px;
  font-weight:700;
  background:linear-gradient(45deg,#22c55e,#0ea5e9);
  -webkit-background-clip:text;
  color:transparent;
}

.btn {
  background:linear-gradient(45deg,#22c55e,#0ea5e9);
  padding:10px 18px;
  border:none;
  border-radius:25px;
  color:white;
  cursor:pointer;
}

/* HERO */
.hero {
  text-align:center;
  padding:40px;
}

.offer {
  background:#22c55e;
  color:black;
  padding:10px;
  border-radius:10px;
  margin-top:10px;
  display:inline-block;
}

/* CARD */
.card {
  background:rgba(255,255,255,0.05);
  margin:20px;
  padding:20px;
  border-radius:15px;
  backdrop-filter: blur(10px);
}

input,textarea {
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:8px;
  border:none;
}

/* REELS */
.reels {
  display:flex;
  gap:10px;
  overflow-x:auto;
}
.reels video {
  width:150px;
  height:260px;
  object-fit:cover;
}

/* SOCIAL */
.social { text-align:center; }
.social a { font-size:30px; margin:10px; }
.insta {color:#E1306C;}
.yt {color:#FF0000;}

/* FLOAT WHATSAPP */
.float {
  position:fixed;
  bottom:20px;
  right:20px;
  background:#25D366;
  padding:15px;
  border-radius:50%;
  color:white;
}

/* PROFILE FLOAT */
.profile-float {
  position: fixed;
  top: 100px;
  right: 20px;
  width: 120px;
  border-radius: 50%;
  border: 3px solid #22c55e;
}

/* MOBILE */
@media(max-width:768px){
  .profile-float {width:70px; top:80px;}
}
</style>
</head>

<body>

<!-- BG VIDEO -->
<video autoplay muted loop playsinline class="bg-video">
  <source src="bg.mp4" type="video/mp4">
</video>

<!-- PROFILE -->
<img src="profile.jpg" class="profile-float" onclick="orderNow()">

<!-- NAV -->
<div class="navbar">
  <div class="logo">🎬 Jabir Edits</div>
  <button class="btn" onclick="orderNow()">Order</button>
</div>

<!-- HERO -->
<div class="hero">
  <h1>Make Your Videos Cinematic 🔥</h1>
  <p>₹200 per minute</p>
  <div class="offer">🎁 Follow karke order karoge toh 10% discount</div>
</div>

<!-- PRICE -->
<div class="card">
<h2>💰 Price Calculator</h2>
<input type="number" id="duration" placeholder="Enter seconds">
<h3 id="price"></h3>
</div>

<!-- REELS -->
<div class="card">
<h2>🔥 Reels Preview</h2>
<div class="reels">
  <video src="reel1.mp4" muted loop autoplay playsinline></video>
  <video src="reel2.mp4" muted loop autoplay playsinline></video>
</div>
</div>

<!-- PAYMENT -->
<div class="card">
<h2>💳 Payment</h2>
<button class="btn" onclick="pay()">Pay Now</button>
</div>

<!-- ORDER -->
<div class="card">
<h2>📝 Order</h2>
<input id="name" placeholder="Name">
<input id="duration2" placeholder="Duration seconds">
<textarea id="details" placeholder="Details"></textarea>
<input id="paymentId" placeholder="Payment ID">
<input type="file">

<p style="color:#22c55e;">After clicking send, attach screenshot on WhatsApp 📸</p>

<button class="btn" onclick="send()">Send Order</button>
</div>

<!-- SOCIAL -->
<div class="card">
<h2>Follow Me</h2>
<div class="social">
<a href="https://www.instagram.com/jabirshaikh_02" target="_blank" class="insta">
<i class="fab fa-instagram"></i>
</a>
<a href="https://youtube.com/@jabirmt" target="_blank" class="yt">
<i class="fab fa-youtube"></i>
</a>
</div>
</div>

<footer style="text-align:center;padding:20px;">© 2026 Jabir Edits</footer>

<a href="https://wa.me/919154185613" class="float">💬</a>

<script>
// PRICE
document.getElementById("duration").addEventListener("input",function(){
 let s=this.value;
 let p=Math.round((s/60)*200);
 document.getElementById("price").innerHTML="₹ "+p;
});

// PAYMENT
function pay(){
 let upi="7035041538-7@ybl";
 let s=document.getElementById("duration2").value;

 if(s=="" || s<=0){
   alert("Pehle duration daalo ❗");
   return;
 }

 let price=Math.round((s/60)*200);
 window.open(`upi://pay?pa=${upi}&pn=Jabir&am=${price}&cu=INR`);
}

// SEND
function send(){
 let n=document.getElementById("name").value;
 let s=document.getElementById("duration2").value;
 let d=document.getElementById("details").value;
 let pid=document.getElementById("paymentId").value;

 if(n==""||s==""||d==""||pid==""){
  alert("Fill all details");
  return;
 }

 let p=Math.round((s/60)*200);

 let msg=encodeURIComponent(
"NEW ORDER\nName:"+n+
"\nDuration:"+s+
"\nPrice ₹"+p+
"\nPayment ID:"+pid+
"\nDetails:"+d
 );

 window.open("https://wa.me/919154185613?text="+msg);
}

function orderNow(){
 window.open("https://wa.me/919154185613");
}
</script>

<!-- ✅ TIDIO AI CHAT (FIXED) -->
<script src="//code.tidio.co/lqktpinbc3ftkmf4xvtayjgozffvrcg.js" async></script>

</body>
</html>
